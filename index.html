<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Reply(ゲストリプライ)| 宿泊施設のための、Googleレビュー多言語返信サービス</title>
<meta name="description" content="宿泊施設のための、Googleレビュー多言語返信サービス。日・英・中・韓の4言語で返信文を作成し、ご確認いただいた上で投稿までを代行します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;        /* 生成り */
    --ink: #1A1A1A;       /* 濃墨 */
    --accent: #2E4A62;    /* 藍 */
    --accent-cta: #9C3D2E;/* 臙脂: CTAボタンのみ */
    --sub: #6B6B6B;       /* キャプション */
    --line: #E0DCD2;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    font-size: 18px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 96px;
  }
  h1, h2, h3 {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  h1 { font-size: 40px; font-weight: 600; }
  h2 { font-size: 32px; font-weight: 600; }
  h3 { font-size: 24px; font-weight: 500; }
  p { margin: 0 0 16px; }
  section { margin-top: 88px; }
  .small { font-size: 14px; color: var(--sub); }

  /* CTAボタン(臙脂はここだけ) */
  .btn-cta {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 15px 32px;
    background: var(--accent-cta);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  @media (min-width: 600px) {
    .btn-cta { display: inline-block; width: auto; }
  }

  /* カード・強調枠 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 24px;
    margin: 0 0 24px;
  }
  .note-box {
    border: 2px solid var(--accent);
    border-radius: 6px;
    padding: 20px 24px;
    margin: 32px 0 0;
  }

  /* チェックリスト */
  ul.checks {
    list-style: none;
    padding: 0;
    margin: 24px 0;
  }
  ul.checks li {
    position: relative;
    padding: 12px 0 12px 32px;
    border-bottom: 1px solid var(--line);
  }
  ul.checks li::before {
    content: "✓";
    position: absolute;
    left: 4px;
    color: var(--accent);
    font-weight: 700;
  }

  /* スクロール連動フェードイン */
  .fade {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .fade.is-visible {
    opacity: 1;
    transform: none;
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .fade {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>
</head>
<body>
<main>
</main>
</body>
</html>
